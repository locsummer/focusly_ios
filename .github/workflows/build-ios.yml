name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Focusly iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Focusly App
        run: |
          xcodebuild clean build \
            -project Focusly.xcodeproj \
            -scheme Focusly \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build"

      - name: Package to IPA
        run: |
          mkdir -p package/Payload
          cp -r build/Release-iphoneos/Focusly.app package/Payload/
          cd package
          zip -r ../Focusly.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focusly-iOS-IPA
          path: Focusly.ipa
          retention-days: 14
